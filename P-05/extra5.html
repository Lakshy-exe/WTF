<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityCare Patient Registration</title>
  <style>
    /* Premium dark anime-inspired monster aesthetic */
    @keyframes floatGlow {
      0%, 100% {
        transform: translateY(0px);
        opacity: 0.7;
      }
      50% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.96);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
      }
      100% {
        transform: scale(0.96);
        opacity: 0.5;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.18), transparent 22%),
        radial-gradient(circle at 80% 10%, rgba(168, 85, 247, 0.18), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(96, 165, 250, 0.12), transparent 30%),
        linear-gradient(135deg, #040812 0%, #0a1220 30%, #0f172a 100%);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 420px;
      height: 420px;
      left: 10%;
      top: 8%;
      background: rgba(34, 211, 238, 0.10);
      animation: floatGlow 7s ease-in-out infinite;
    }

    body::after {
      width: 460px;
      height: 460px;
      right: 12%;
      bottom: 12%;
      background: rgba(168, 85, 247, 0.12);
      animation: floatGlow 9s ease-in-out infinite reverse;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 34px 30px 26px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(125, 211, 252, 0.5);
      border-radius: 24px;
      box-shadow:
        0 0 0 1px rgba(147, 197, 253, 0.15),
        0 24px 60px rgba(2, 6, 23, 0.72),
        0 0 32px rgba(34, 211, 238, 0.12);
      backdrop-filter: blur(10px);
      animation: fadeUp 0.8s ease-out both;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 18px;
      pointer-events: none;
      animation: pulseRing 5s ease-in-out infinite;
    }

    .container::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 30px;
      border: 1px solid rgba(103, 232, 249, 0.08);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .container {
        padding: 22px 18px 18px;
      }
    }

    h2 {
      text-align: center;
      color: #edf6ff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 8px;
      font-weight: 900;
      text-shadow: 0 0 12px rgba(125, 211, 252, 0.42);
    }

    h3 {
      text-align: center;
      color: #dbeafe;
      letter-spacing: 0.10em;
      font-size: 0.94rem;
      text-transform: uppercase;
      margin: 0 0 22px;
      opacity: 0.92;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 700;
      color: #eff6ff;
      letter-spacing: 0.03em;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px 15px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      font-size: 15px;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(191, 219, 254, 0.72);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #67e8f9;
      box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.16), inset 0 0 12px rgba(103, 232, 249, 0.08);
      transform: translateY(-1px);
    }

    .error {
      color: #fda4af;
      font-size: 13px;
      margin-top: 6px;
      min-height: 16px;
    }

    .success {
      color: #a7f3d0;
      font-weight: bold;
      text-align: center;
      margin-top: 18px;
      letter-spacing: 0.04em;
      text-shadow: 0 0 10px rgba(167, 243, 208, 0.3);
    }

    button {
      width: 100%;
      padding: 15px 18px;
      margin-top: 22px;
      background: linear-gradient(135deg, #22d3ee 0%, #60a5fa 45%, #a78bfa 100%);
      color: #07131d;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 12px 26px rgba(96, 165, 250, 0.26);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #67e8f9 0%, #7dd3fc 35%, #c4b5fd 100%);
      box-shadow: 0 16px 28px rgba(34, 211, 238, 0.32);
      transform: translateY(-2px) scale(1.01);
    }

    button:active {
      transform: translateY(0) scale(0.995);
    }

    input, select, textarea, button {
      will-change: transform, box-shadow, border-color;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Edit hospital name and form heading text here -->
    <h2>Eisler Memorial Hospital</h2>
    <h3>Patient Admission Form</h3>
 
    <form id="patientForm" novalidate>
      <!-- Edit the name field label and placeholder text here -->
      <label for="name">Patient Name *</label>
      <input type="text" id="name" placeholder="Enter full name"
             autocomplete="name">
      <div class="error" id="nameError" aria-live="polite"></div>
 
      <!-- Edit email field label and example text here -->
      <label for="email">Email Address *</label>
      <input type="text" id="email" placeholder="example@gmail.com"
             autocomplete="email">
      <div class="error" id="emailError" aria-live="polite"></div>
 
      <!-- Edit mobile field label and placeholder here -->
      <label for="mobile">Mobile Number *</label>
      <input type="text" id="mobile" placeholder="10-digit mobile number"
             inputmode="numeric" maxlength="10" autocomplete="tel-national">
      <div class="error" id="mobileError" aria-live="polite"></div>
 
      <!-- Edit DOB label here -->
      <label for="dob">Date of Birth *</label>
      <input type="date" id="dob">
      <div class="error" id="dobError" aria-live="polite"></div>
 
      <!-- Edit gender options here -->
      <label for="gender">Gender *</label>
      <select id="gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>
      <div class="error" id="genderError" aria-live="polite"></div>
 
      <!-- Edit address label and placeholder here -->
      <label for="address">Address *</label>
      <textarea id="address" rows="3" placeholder="Enter your address"></textarea>
      <div class="error" id="addressError" aria-live="polite"></div>
 
      <!-- Edit password field label and placeholder here -->
      <label for="password">Password *</label>
      <input type="password" id="password" placeholder="Create a password"
             autocomplete="new-password">
      <div class="error" id="passwordError" aria-live="polite"></div>
 
      <!-- Edit confirm password field label and placeholder here -->
      <label for="confirmPassword">Confirm Password *</label>
      <input type="password" id="confirmPassword"
             placeholder="Re-enter password" autocomplete="new-password">
      <div class="error" id="confirmError" aria-live="polite"></div>
 
      <!-- Edit button text here -->
      <button type="submit">Submit Registration</button>
      <div id="result" class="success" role="status"
           aria-live="polite"></div>
    </form>
  </div>
 
  <script>
    // Edit the form ID if you rename the form in HTML.
    const form = document.getElementById("patientForm");
 
    // This function shows validation errors for each field.
    function showError(id, message) {
      document.getElementById(id + "Error").textContent = message;
    }
 
    // Clear all previous validation messages before rechecking.
    function clearErrors() {
      document.querySelectorAll(".error").forEach(function (el) {
        el.textContent = "";
      });
      document.getElementById("result").textContent = "";
    }
 
    // Edit the name validation rules here if you want stricter/looser checks.
    function validateName() {
      const name = document.getElementById("name").value.trim();
      const pattern = /^[A-Za-z][A-Za-z .'-]{1,49}$/;
      if (name === "") {
        showError("name", "Patient name is required.");
        return false;
      }
      if (!pattern.test(name)) {
        showError("name", "Enter a valid name (2–50 characters).");
        return false;
      }
      return true;
    }
 
    // Edit the email pattern or message here.
    function validateEmail() {
      const email = document.getElementById("email").value.trim();
      const pattern =
        /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
      if (email === "") {
        showError("email", "Email is required.");
        return false;
      }
      if (!pattern.test(email)) {
        showError("email", "Enter a valid email address.");
        return false;
      }
      return true;
    }
 
    // Edit mobile number rules here, including allowed starting digits.
    function validateMobile() {
      const mobile = document.getElementById("mobile").value.trim();
      const pattern = /^[6-9][0-9]{9}$/;
      if (mobile === "") {
        showError("mobile", "Mobile number is required.");
        return false;
      }
      if (!pattern.test(mobile)) {
        showError("mobile",
          "Enter a valid 10-digit Indian mobile number.");
        return false;
      }
      return true;
    }
 
    // Edit DOB validation rules here if you want to allow future dates or different age checks.
    function validateDOB() {
      const dob = document.getElementById("dob").value;
      if (dob === "") {
        showError("dob", "Date of birth is required.");
        return false;
      }
      const selectedDate = new Date(dob + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (Number.isNaN(selectedDate.getTime()) ||
          selectedDate > today) {
        showError("dob", "Date of birth cannot be in the future.");
        return false;
      }
      return true;
    }
 
    // Edit gender validation message here if needed.
    function validateGender() {
      const gender = document.getElementById("gender").value;
      if (gender === "") {
        showError("gender", "Please select your gender.");
        return false;
      }
      return true;
    }
 
    // Edit address length restrictions here.
    function validateAddress() {
      const address =
        document.getElementById("address").value.trim();
      if (address === "") {
        showError("address", "Address is required.");
        return false;
      }
      if (address.length < 5 || address.length > 200) {
        showError("address",
          "Address must contain 5–200 characters.");
        return false;
      }
      return true;
    }
 
    // Edit password requirements here: min length, uppercase, number, symbol.
    function validatePassword() {
      const password = document.getElementById("password").value;
      const pattern =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S{8,64}$/;
      if (password === "") {
        showError("password", "Password is required.");
        return false;
      }
      if (!pattern.test(password)) {
        showError("password",
          "Use 8–64 characters with uppercase, lowercase, " +
          "a number and a special character.");
        return false;
      }
      return true;  
    }
 
    // Edit confirm password validation message here.
    function validateConfirmPassword() {
      const password = document.getElementById("password").value;
      const confirm =
        document.getElementById("confirmPassword").value;
      if (confirm === "") {
        showError("confirm", "Please confirm your password.");
        return false;
      }
      if (password !== confirm) {
        showError("confirm", "Passwords do not match.");
        return false;
      }
      return true;
    }
 
    // Edit the success message text and reset behavior here.
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      clearErrors();
 
      const isValid = [
        validateName(),
        validateEmail(),
        validateMobile(),
        validateDOB(),
        validateGender(),
        validateAddress(),
        validatePassword(),
        validateConfirmPassword()
      ].every(Boolean);
 
      if (isValid) {
        document.getElementById("result").textContent =
          "Registration form validated successfully!";
        // Demonstration only: no data is sent or stored.
        form.reset();
      }
    });
  </script>
</body>
</html>
