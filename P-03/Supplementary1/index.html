<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h2>Student Result Calculator</h2>
        <div class="input-group">
            <label for="math">Mathematics:</label>
            <input type="number" id="math" placeholder="Enter marks (0-100)">
        </div>
        <div class="input-group">
            <label for="science">Science:</label>
            <input type="number" id="science" placeholder="Enter marks (0-100)">
        </div>
        <div class="input-group">
            <label for="english">English:</label>
            <input type="number" id="english" placeholder="Enter marks (0-100)">
        </div>
        
        <button onclick="calculateResult()">Calculate Result</button>

        <div id="result-display" class="result-box hidden">
            <p><strong>Total Marks:</strong> <span id="total-marks"></span> / 300</p>
            <p><strong>Percentage:</strong> <span id="percentage"></span>%</p>
            <p><strong>Grade:</strong> <span id="grade"></span></p>
            <p><strong>Classification:</strong> <span id="classification"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
