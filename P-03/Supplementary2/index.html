<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h2>Electricity Bill Calculator</h2>
        <div class="input-group">
            <label for="units">Units Consumed:</label>
            <input type="number" id="units" placeholder="Enter total units (e.g., 150)">
        </div>
        
        <button onclick="calculateBill()">Calculate Bill</button>

        <div id="result-display" class="result-box hidden">
            <p><strong>Total Payable Amount:</strong> ₹<span id="bill-amount"></span></p>
            <p style="font-size: 0.85em; color: #666;">*Includes standard ₹50 fixed connection charge.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
