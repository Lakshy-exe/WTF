<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardened Login Module | P10 Supplementary 1</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 8px 0 14px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0f172a; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        #msg { margin-top: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Hardened Login Demo</h2>
        <p style="font-size:0.9rem;color:#475569;">Valid: <b>admin</b> / <b>Admin@123</b> (Locks after 5 fails)</p>
        <form id="f">
            <label>Username</label>
            <input type="text" id="u" required>
            <label>Password</label>
            <input type="password" id="p" required>
            <button type="submit">Secure Login</button>
        </form>
        <div id="msg"></div>
    </div>
    <script>
        document.getElementById('f').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/secure-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
            });
            const data = await res.json();
            const m = document.getElementById('msg');
            m.style.color = res.ok ? '#15803d' : '#b91c1c';
            m.textContent = data.message || data.error;
        });
    </script>
</body>
</html>
