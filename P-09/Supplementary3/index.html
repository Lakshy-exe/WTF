<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie & Show Information System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CineVault Movie & Show Explorer</h1>
        <p>JSON-Powered Media Posters, Ratings & Synopses</p>
    </header>
    <main>
        <form id="movieForm">
            <input type="text" id="searchInput" placeholder="Search title (e.g., Interstellar, Batman, Sherlock)" required>
            <button type="submit">Search</button>
        </form>
        <p id="status"></p>
        <div id="movieGrid" class="grid"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
