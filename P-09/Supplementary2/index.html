<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>BookFinder REST Explorer</h1>
        <p>Search Books via OpenLibrary JSON API</p>
    </header>
    <main>
        <form id="searchForm">
            <input type="text" id="query" placeholder="Search by title, author, or ISBN (e.g., Clean Code, Harry Potter)" required>
            <button type="submit">Search Books</button>
        </form>
        <p id="msg"></p>
        <div id="results" class="grid"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
