<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Information Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather Information Portal</h1>
        <p class="subtitle">Real-time REST API & JSON Weather Lookup</p>
        <form id="weatherForm">
            <input type="text" id="cityInput" placeholder="Enter city (e.g., Ahmedabad, London, Tokyo)" required>
            <button type="submit">Get Weather</button>
        </form>
        <p id="status"></p>
        <div id="weatherCard" class="card hidden"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
