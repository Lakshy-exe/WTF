<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMart | Inventory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold text-info">TechMart Inventory</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light small" id="welcomeUser">Welcome</span>
                <button id="logoutBtn" class="btn btn-outline-warning btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="statusAlert" class="alert d-none" role="alert"></div>

        <div class="row g-4">
            <!-- Left Column: Add / Edit Form -->
            <div class="col-12 col-lg-4">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="fw-bold mb-3" id="formTitle">Add New Product</h5>
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Product Name</label>
                            <input type="text" id="name" class="form-control" required placeholder="e.g., Wireless Mouse">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Category</label>
                            <select id="category" class="form-select" required>
                                <option value="Peripherals">Peripherals</option>
                                <option value="Displays">Displays</option>
                                <option value="Components">Components</option>
                                <option value="Accessories">Accessories</option>
                            </select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Price (₹)</label>
                                <input type="number" id="price" class="form-control" min="1" step="0.01" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Quantity</label>
                                <input type="number" id="quantity" class="form-control" min="0" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary fw-semibold" id="saveBtn">Save Product</button>
                            <button type="button" class="btn btn-secondary btn-sm d-none" id="cancelEditBtn">Cancel Edit</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Right Column: Live Product Table -->
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm p-4">
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-3 gap-2">
                        <h5 class="fw-bold mb-0">Stock Inventory</h5>
                        <input type="text" id="searchInput" class="form-control form-control-sm w-auto" placeholder="Search products...">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Product</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let allProducts = [];

        // Output encoding to prevent XSS attacks
        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&', '<': '<', '>': '>', '"': '"', "'": '''
            }[m]));
        }

        function notify(msg, type = 'success') {
            const box = document.getElementById('statusAlert');
            box.textContent = msg;
            box.className = `alert alert-${type}`;
            setTimeout(() => box.classList.add('d-none'), 3000);
        }

        async function loadUser() {
            const res = await fetch('/api/user');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('welcomeUser').textContent = `Hi, ${data.username}`;
            }
        }

        async function loadProducts() {
            const res = await fetch('/api/products');
            if (res.status === 401) return (window.location.href = '/login.html');
            allProducts = await res.json();
            renderTable(allProducts);
        }

        function renderTable(items) {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = items.map(p => `
                <tr>
                    <td>#${p.id}</td>
                    <td class="fw-semibold">${escapeHTML(p.name)}</td>
                    <td><span class="badge bg-secondary">${escapeHTML(p.category)}</span></td>
                    <td>₹${Number(p.price).toLocaleString('en-IN')}</td>
                    <td>${p.quantity}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const payload = {
                name: document.getElementById('name').value.trim(),
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                quantity: document.getElementById('quantity').value
            };

            const url = id ? `/api/products/${id}` : '/api/products';
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                notify(data.message, 'success');
                resetForm();
                loadProducts();
            } else {
                notify(data.error, 'danger');
            }
        });

        function editProduct(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return;
            document.getElementById('productId').value = p.id;
            document.getElementById('name').value = p.name;
            document.getElementById('category').value = p.category;
            document.getElementById('price').value = p.price;
            document.getElementById('quantity').value = p.quantity;
            document.getElementById('formTitle').textContent = `Edit Product #${p.id}`;
            document.getElementById('saveBtn').textContent = 'Update Product';
            document.getElementById('cancelEditBtn').classList.remove('d-none');
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (res.ok) {
                notify(data.message, 'warning');
                loadProducts();
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('formTitle').textContent = 'Add New Product';
            document.getElementById('saveBtn').textContent = 'Save Product';
            document.getElementById('cancelEditBtn').classList.add('d-none');
        }

        document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            renderTable(allProducts.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)));
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        loadUser();
        loadProducts();
    </script>
</body>
</html>
