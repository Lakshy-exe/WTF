<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMart | Staff Login & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm p-4">
                    <h3 class="text-center fw-bold text-primary mb-1">TechMart Portal</h3>
                    <p class="text-center text-muted small mb-4">Inventory & Store Management</p>

                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <form id="authForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" id="username" class="form-control" minlength="3" required placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" id="password" class="form-control" minlength="6" required placeholder="Min 6 characters">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" id="loginBtn" class="btn btn-primary fw-semibold">Login</button>
                            <button type="button" id="registerBtn" class="btn btn-outline-secondary btn-sm">New Staff? Register Account</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alertBox');

        function showAlert(msg, type) {
            alertBox.textContent = msg;
            alertBox.className = `alert alert-${type}`;
        }

        async function handleAuth(endpoint) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (!res.ok) {
                showAlert(data.error || 'Action failed', 'danger');
            } else if (endpoint === '/api/login') {
                window.location.href = '/index.html';
            } else {
                showAlert(data.message, 'success');
            }
        }

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleAuth('/api/login');
        });

        document.getElementById('registerBtn').addEventListener('click', () => {
            handleAuth('/api/register');
        });
    </script>
</body>
</html>
