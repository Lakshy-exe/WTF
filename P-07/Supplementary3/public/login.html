<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Login | Grand Horizon Hotel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <div class="brand">Grand Horizon Hotel</div>
        <div><a href="/">Home</a></div>
    </nav>
    <div class="container" style="max-width:430px;">
        <div class="card">
            <h2>Guest Login</h2>
            <p>Demo Login: <strong>guest1</strong> / <strong>hotel123</strong></p>
            <div id="alertBox"></div>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required placeholder="guest1">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="hotel123">
                </div>
                <button type="submit" class="btn" style="width:100%;">Login to Booking Portal</button>
            </form>
        </div>
    </div>
    <script>
        const p = new URLSearchParams(window.location.search);
        if (p.get('error')) document.getElementById('alertBox').innerHTML = '<div class="alert">Invalid username or password.</div>';
        if (p.get('loggedout')) document.getElementById('alertBox').innerHTML = '<div class="alert" style="background:#dcfce7;color:#166534;">Logged out securely.</div>';
    </script>
</body>
</html>
