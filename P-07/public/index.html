<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central City Library</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 32px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        nav {
            display: flex;
            gap: 16px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 14px;
            margin-bottom: 24px;
        }
        nav a {
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }
        nav a:hover {
            text-decoration: underline;
        }
        h1 {
            margin-top: 0;
            color: #111827;
        }
        p {
            line-height: 1.6;
            color: #4b5563;
        }
        .btn-group {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .btn-outline {
            background-color: transparent;
            color: #2563eb;
            border: 1px solid #2563eb;
        }
        .btn-outline:hover {
            background-color: #eff6ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/login">Login</a>
            <a href="/dashboard">Dashboard</a>
        </nav>

        <h1>Central City Library</h1>
        <p>Welcome to the official digital membership portal for students and staff. Log in to access digital books, research papers, and online journals.</p>

        <div class="btn-group">
            <a href="/login" class="btn">Member Login</a>
            <a href="/dashboard" class="btn btn-outline">Access Dashboard</a>
        </div>
    </div>
</body>
</html>
