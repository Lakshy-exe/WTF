<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Student Information Management System</h1>
    <div class="card">
        <h2 id="formTitle">Register Student</h2>
        <form id="studentForm">
            <input type="hidden" id="studentId">
            <div class="grid-form">
                <input type="text" id="roll_no" placeholder="Roll No (e.g., 26IT042)" required>
                <input type="text" id="full_name" placeholder="Full Name" required>
                <input type="text" id="department" placeholder="Department (e.g., IT)" required>
                <input type="number" id="semester" placeholder="Semester (1-8)" min="1" max="8" required>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <button type="submit" id="submitBtn">Add Student</button>
            <button type="button" class="secondary" onclick="resetForm()">Clear</button>
        </form>
        <p id="msg"></p>
    </div>
    <div class="card">
        <h2>Enrolled Students</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Roll No</th><th>Name</th><th>Department</th><th>Sem</th><th>Email</th><th>Actions</th></tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
